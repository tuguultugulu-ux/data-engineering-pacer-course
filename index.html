<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACER Data Engineering Course</title>
    
    <!-- Modern Stylesheet -->
    <link rel="stylesheet" href="css/styles.css?v=600">
    
    <!-- CodeMirror (Editor & Monokai Theme) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    
    <!-- Pyodide Core -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
</head>
<body>
    <!-- Navigation Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>PACER Data Engineering</h2>
            <p>10-Week End-to-End Curriculum</p>
        </div>
        <ul id="nav-list" class="sidebar-nav">
            <!-- Dynamically populated from course-data.js -->
        </ul>
    </aside>

    <!-- Main Workspace Content -->
    <main class="main-content">
        <div class="main-container" id="content-container">
            <!-- Dynamically rendered by app.js -->
        </div>
    </main>

    <!-- Global Fixed Action Footer -->
    <footer class="global-footer">
        <div class="footer-left">
            <span id="footer-pyodide-status">Initializing Python...</span>
            <span style="margin: 0 8px; opacity: 0.4;">|</span>
            <span id="active-cell-label">Click inside a code cell to begin</span>
        </div>
        <div class="footer-right">
            <span><kbd>Ctrl/Cmd + Enter</kbd> Run Code</span>
            <span><kbd>Ctrl + Space / Alt + R</kbd> Code Rabbit Review</span>
        </div>
    </footer>

    <!-- CodeMirror Core & Python Syntax -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>

    <!-- Application Modules -->
    <script src="js/course-data.js?v=600"></script>
    <script src="js/pyodide-engine.js?v=600"></script>
    <script src="js/editor-manager.js?v=600"></script>
    <script src="js/app.js?v=600"></script>
</body>
</html>
